<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Night</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1c1c1e;--accent:#5b3fd6;--muted:#777;--line:#e2e0da;--ok:#1e8e4e;--warn:#b26a00;--err:#c0392b;
  --ink:#111;--blue:#2a74d6;--red:#e63b2e;--yellow:#f6c324;--comic-font:"Luckiest Guy",system-ui,sans-serif;
  /* sfondo stile copertina: raggi blu/rosso/giallo, retino a puntini e luce al centro */
  --comic:radial-gradient(circle at 50% 42%,rgba(255,255,255,.45),rgba(255,255,255,0) 55%),
    radial-gradient(circle,rgba(0,0,0,.16) 1.3px,transparent 1.9px) 0 0/12px 12px,
    repeating-conic-gradient(from -6deg at 50% 42%,var(--blue) 0 10deg,var(--red) 10deg 20deg,var(--yellow) 20deg 30deg)}
@media (prefers-color-scheme: dark){:root{--bg:#17171a;--card:#222227;--text:#eee;--accent:#9b8cff;--muted:#999;--line:#333;--warn:#f0a030;--err:#ff6b5b}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--comic);background-color:var(--bg);background-attachment:fixed;color:var(--text);padding:16px;max-width:720px;margin:auto;min-height:100vh}
/* sfondo scelto dal presentatore: sostituisce quello a fumetto */
body.custom-bg{background:var(--bg) center/cover fixed}
h1{font-family:var(--comic-font);font-weight:400;font-size:2rem;letter-spacing:.02em;margin:0 0 12px;color:#fff;
  text-shadow:3px 3px 0 var(--ink),-1.5px -1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px 1.5px 0 var(--ink)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button{flex:1;padding:10px;border:2px solid var(--ink);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-weight:600;box-shadow:3px 3px 0 var(--ink)}
nav button.on{background:var(--accent);color:#fff}
.card{background:var(--card);border:3px solid var(--ink);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:5px 5px 0 var(--ink)}
input,select,textarea{width:100%;padding:10px;margin:4px 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font:inherit;margin:3px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#c0392b}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.4}
.big-opt{display:block;width:100%;padding:22px;font-size:1.2rem;margin:8px 0}
.muted{color:var(--muted);font-size:.9rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.good{border-color:var(--ok);color:var(--ok)}
.big{font-size:1.25rem;font-weight:600;margin:8px 0}
.me{outline:2px solid var(--accent)}
.pod{display:flex;align-items:center;gap:12px;padding:16px;margin:8px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:1.3rem}
.pos{width:48px;text-align:center;font-size:1.6rem}
.pname{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ppts{font-size:1.8rem;font-weight:800;color:var(--accent)}
.pme{outline:3px solid var(--accent)}
.qr{background:#fff;padding:12px;display:inline-block;border-radius:8px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumbs img{height:70px;border-radius:6px}
.msg-err{color:var(--err)}
.msg-warn{color:var(--warn)}
.rhead{margin:10px 0 4px;font-weight:700}
/* regia del presentatore: dove siamo, cosa succede, un solo pulsante per andare avanti */
.regia{border-color:var(--accent)}
.step{font-family:var(--comic-font);letter-spacing:.03em;color:var(--accent);font-size:1.05rem}
.next-btn{display:block;width:100%;padding:16px;font-size:1.15rem;font-weight:700;margin:0;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.next-btn:disabled{opacity:.35;box-shadow:none}
.next-btn.hot{background:var(--ok);animation:pulse 1.2s ease-in-out infinite}
.all-in{display:block;font-weight:700;color:var(--ok);font-size:1.1rem}
.buzz-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.buzz-box{flex:1;min-width:180px;padding:10px 14px;border:2px dashed #999;border-radius:8px;color:#666}
.buzz-box.on{background:var(--yellow);color:#000;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:1.35rem;animation:pulse 1.2s ease-in-out infinite}
.buzz-box.on strong{font-family:var(--comic-font);letter-spacing:.03em;font-size:1.6rem}
.buzz-next{display:block;font-size:.95rem;font-weight:400}
@keyframes pulse{50%{transform:scale(1.025)}}
@media (prefers-reduced-motion: reduce){.next-btn.hot,.buzz-box.on{animation:none}}
.fix summary{cursor:pointer}
.fix .row select{flex:1;margin:0}

/* ---------- proiettore: riquadri a fumetto (bianco, bordo nero, ombra piena) sullo sfondo a raggi ---------- */
body.proj{max-width:none;padding:0;color:var(--ink);overflow:hidden;font-size:clamp(16px,1.6vw,32px)}
body.proj h1{display:none}
.pj{position:fixed;inset:0;display:flex;flex-direction:column;padding:3vh 3vw}
.comic-box{background:#fff;border:.2em solid var(--ink);border-radius:.6em;box-shadow:.4em .4em 0 var(--ink)}
.comic-title{font-family:var(--comic-font);font-weight:400;color:#fff;letter-spacing:.02em;
  text-shadow:.08em .08em 0 var(--ink),-.04em -.04em 0 var(--ink),.04em -.04em 0 var(--ink),-.04em .04em 0 var(--ink),.04em .04em 0 var(--ink)}
.pj-tag{font-family:var(--comic-font);background:var(--ink);color:#fff;padding:.25em .7em .1em;border-radius:.3em;letter-spacing:.03em}
.pj-full{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
.pj-full img{max-width:100%;max-height:100%;object-fit:contain;border:.25em solid var(--ink);border-radius:.6em;box-shadow:.5em .5em 0 var(--ink)}
.pj-cap{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%) rotate(-2deg);padding:.2em .9em 0;font-size:2.4em;white-space:nowrap;
  font-family:var(--comic-font);background:var(--yellow);border:.08em solid var(--ink);border-radius:.25em;box-shadow:.12em .12em 0 var(--ink)}
.pj-main{flex:1;display:flex;flex-direction:column;justify-content:safe center;max-width:calc(100% - 23vw);min-height:0;overflow:hidden;margin-top:2vh;padding:1em 1.4em}
.pj-top{display:flex;gap:1em;align-items:center;font-size:.95em}
.pj-timer{font-family:var(--comic-font);font-size:2.2em;margin-left:auto;margin-right:22vw;background:var(--red);color:#fff;padding:.15em .5em 0;
  border:.07em solid var(--ink);border-radius:.25em;box-shadow:.1em .1em 0 var(--ink);min-width:3.2em;text-align:center}
.pj-q{font-size:2em;font-weight:800;line-height:1.25;margin:.3em 0}
.pj-q.long{font-size:1.45em}
.pj-cat{font-family:var(--comic-font);font-size:1.2em;color:var(--red);letter-spacing:.04em}
.pj-opts{display:grid;grid-template-columns:1fr 1fr;gap:.7em;margin-top:.6em}
.pj-opt{padding:.7em 1em;border-radius:.5em;font-size:1.25em;font-weight:700;transition:opacity .3s,transform .3s;border:.12em solid var(--ink);box-shadow:.2em .2em 0 var(--ink)}
.pj-opts.long .pj-opt{font-size:.95em}
.pj-opt.dim{opacity:.25}
.pj-opt.right{transform:scale(1.03);box-shadow:0 0 0 .2em #fff,0 0 0 .4em var(--ink)}
.pj-imgs{display:grid;grid-template-columns:1fr 1fr;gap:1vh;flex:1;min-height:0}
.pj-imgs img{width:100%;height:100%;object-fit:contain;min-height:0}
.pj-imgs.one{grid-template-columns:1fr}
.pj-clues{list-style:none;padding:0;margin:.4em 0}
.pj-clues li{font-size:1.5em;font-weight:600;padding:.35em .6em;margin:.3em 0;background:#fff6cf;border:.08em solid var(--ink);border-radius:.4em}
.pj-clues li b{font-family:var(--comic-font);font-weight:400;color:var(--red);margin-right:.5em}
.pj-box{margin-top:.6em;padding:.6em 1em;border-radius:.5em;font-size:1.3em;font-weight:700;border:.12em solid var(--ink);box-shadow:.2em .2em 0 var(--ink)}
.pj-hint{background:var(--yellow)}
.pj-sol{background:var(--ok);color:#fff}
.pj-sol .n{font-size:.75em;font-weight:500;margin-top:.3em}
.pj-board{position:fixed;top:3vh;right:2vw;width:19vw;padding:.6em .8em;font-size:.85em}
.pj-board h3{font-family:var(--comic-font);font-weight:400;margin:0 0 .3em;font-size:1.3em;color:var(--red)}
.pj-board div{display:flex;justify-content:space-between;gap:.5em;padding:.15em 0;font-weight:600}
.pj-board span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.5vh}
.pj-title{font-size:4em}
.pj-teams{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;max-width:80vw}
.pj-teams span{background:#fff;padding:.3em .8em;border-radius:99px;border:.1em solid var(--ink);font-weight:700;box-shadow:.12em .12em 0 var(--ink)}
.pj-buzz{font-size:1.4em;margin-top:.4em}
.pj-pod{width:min(70vw,1100px)}
.pj-pod h2{font-family:var(--comic-font);font-weight:400;font-size:2.4em;color:#fff;text-shadow:.08em .08em 0 var(--ink)}
.pj-pod .pod{background:#fff;border:.12em solid var(--ink);box-shadow:.25em .25em 0 var(--ink);color:var(--ink);font-size:1.4em}
.pj-pod .ppts{font-family:var(--comic-font);font-weight:400;color:var(--red)}
body.proj .qr{border:.2em solid var(--ink);box-shadow:.3em .3em 0 var(--ink)}
.pj-fs{position:fixed;bottom:1vh;right:1vw;opacity:.4;font-size:12px}
.pj-snd{position:fixed;bottom:1vh;left:1vw;font-size:14px;font-weight:700;background:var(--yellow);border:2px solid var(--ink);border-radius:6px;padding:4px 10px;cursor:pointer}
</style>
</head>
<body>
<h1 id="title">🎲 Quiz Night</h1>
<div id="app"></div>
<!-- fuori da #app: se la pagina si ridisegna mentre la finestra di scelta è aperta, il file scelto non va perso -->
<input type="file" id="pickDocx" hidden accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onchange="loadDocx(this.files[0]); this.value=''">
<input type="file" id="pickBg" hidden accept="image/jpeg,image/png" onchange="loadBg(this)">

<script>
/* CONFIGURAZIONE: sostituisci con l'URL del tuo database Firebase */
const DB_URL = "https://quiz-aa578-default-rtdb.europe-west1.firebasedatabase.app/";

const PARAMS = new URLSearchParams(location.search);
/* ?demo: tutto resta nel browser (localStorage), utile per provare senza toccare Firebase */
const DEMO = PARAMS.has("demo");
/* L'indirizzo senza parametri è quello dei concorrenti. Il presentatore entra con ?regia=<parola segreta>:
   qui c'è solo l'impronta della parola, così leggere il codice non basta a scoprirla. In modalità prova basta ?regia */
const REGIA_HASH = "105ekgnjmg7";
const hashWord = s => {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (const ch of String(s).trim().toLowerCase()) {
    const c = ch.codePointAt(0);
    h1 = Math.imul(h1 ^ c, 2654435761);
    h2 = Math.imul(h2 ^ c, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
};
const IS_PROJ = PARAMS.has("proiettore");
const WANTS_HOST = !IS_PROJ && PARAMS.has("regia");
const IS_HOST = WANTS_HOST && (DEMO || hashWord(PARAMS.get("regia")) === REGIA_HASH);
const IS_PLAYER = !IS_HOST && !IS_PROJ;
const HOST_TABS = ["Gioco", "Domande", "Squadre", "QR"];

/* finto database con la stessa interfaccia di Firebase usata qui; le schede dello stesso browser si sincronizzano */
function demoDB(){
  const KEY = "qnDemo", subs = [];
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) { return {}; } };
  let tree = load();
  const parts = p => String(p || "").split("/").filter(Boolean);
  const get = p => parts(p).reduce((o,k) => o == null ? null : o[k], tree) ?? null;
  const clone = v => v == null ? null : JSON.parse(JSON.stringify(v));
  const fix = v => Array.isArray(v) ? v.map(fix) : v && typeof v === "object" ? (v[".sv"] ? Date.now() : Object.fromEntries(Object.entries(v).map(([k,x]) => [k, fix(x)]))) : v;
  function put(p, v){
    const ks = parts(p);
    if (!ks.length) { tree = v || {}; return; }
    let o = tree;
    ks.slice(0,-1).forEach(k => { if (!o[k] || typeof o[k] !== "object") o[k] = {}; o = o[k]; });
    if (v == null) delete o[ks[ks.length-1]]; else o[ks[ks.length-1]] = v;
  }
  const notify = () => subs.forEach(s => s.cb({ val: () => clone(get(s.path)) }));
  function commit(){
    try { localStorage.setItem(KEY, JSON.stringify(tree)); }
    catch(e) { alert("Modalità prova: spazio del browser esaurito (" + e.message + ")"); }
    notify();
    return Promise.resolve();
  }
  addEventListener("storage", e => { if (e.key === KEY) { tree = load(); notify(); } });
  const ref = path => ({
    on(ev, cb){
      if (path === ".info/serverTimeOffset") return cb({ val: () => 0 });
      subs.push({path, cb});
      setTimeout(() => cb({ val: () => clone(get(path)) }));
    },
    once: () => Promise.resolve({ val: () => clone(get(path)) }),
    set: v => { put(path, fix(v)); return commit(); },
    remove: () => { put(path, null); return commit(); },
    update: obj => { Object.entries(obj).forEach(([k,v]) => put((path ? path + "/" : "") + k, fix(v))); return commit(); }
  });
  return { ref };
}

let DB;
if (DEMO) DB = demoDB();
else { firebase.initializeApp({ databaseURL: DB_URL }); DB = firebase.database(); }

let ST = {};
let SECRET = {};   // risposte e note: le legge solo il presentatore
const IMG = {};    // cache delle immagini già scaricate
let tab = "Gioco";
let myTeam = localStorage.getItem("qnTeam") || "";
let doneKey = null;
let upMsg = "";
/* differenza tra l'orologio locale e quello di Firebase: tutti i dispositivi usano la stessa ora */
let OFFSET = 0;
DB.ref(".info/serverTimeOffset").on("value", s => { OFFSET = s.val() || 0; });
const now = () => Date.now() + OFFSET;
const TS = firebase.database.ServerValue.TIMESTAMP;

/* ---------- utilità ---------- */
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const cfg = () => ST.config || { phase: "copertina", idx: 0 };
const qs = () => Object.entries(ST.questions || {}).map(([id,q]) => ({id, ...q})).sort((a,b) => a.order - b.order);
const teams = () => Object.entries(ST.teams || {}).map(([id,t]) => ({id, ...t}));
const curQ = () => { const l = qs(); return l[Math.min(Math.max(cfg().idx || 0, 0), l.length - 1)]; };
const roundOf = q => (q && ST.rounds?.[q.round]) || {};
const quizName = () => ST.settings?.name || "Quiz Night";
const LETTERS = "ABCDEFGH";
const COLS = ["#e74c3c","#2980b9","#f1c40f","#27ae60","#8e44ad","#e67e22"];
const optStyle = i => `background:${COLS[i%COLS.length]};color:${i%COLS.length===2?'#000':'#fff'}`;
const TYPE_NAMES = { scelta: "scelta multipla", prenota: "prenotazione a voce", indizi: "indizi progressivi", testo: "risposta scritta" };
const isBuzz = q => q.type === "prenota" || q.type === "indizi";
const qOpts = q => String(q.options || "").split("|").filter(Boolean);
/* Firebase può restituire le liste come oggetti {0:…,1:…} */
const arr = v => Array.isArray(v) ? v : Object.values(v || {});
const qClues = q => arr(q.clues);
const qImgs = q => arr(q.images);
const qSecs = q => q.secs ?? 30;
/* nelle domande a indizi il valore cala di 1 per ogni indizio svelato */
const ptsNow = q => q.type === "indizi" ? Math.max(1, (Number(q.points) || 1) - ((cfg().clues || 1) - 1)) : Number(q.points) || 0;
const awardVal = (q, v) => v === true ? Number(q.points) || 0 : Number(v) || 0;
const reveal = q => (q && ST.reveal?.[q.id]) || {};
const link = k => location.href.split("?")[0] + "?" + k + (DEMO ? "&demo" : "");
function scores(){
  const m = {};
  teams().forEach(t => m[t.id] = 0);
  qs().forEach(q => Object.entries(q.awarded || {}).forEach(([tid,v]) => { if (tid in m) m[tid] += awardVal(q, v); }));
  return m;
}
const ranked = () => { const sc = scores(); return teams().filter(t => t.confirmed).sort((a,b) => sc[b.id] - sc[a.id]).map(t => ({...t, pts: sc[t.id]})); };
function board(me){
  return ranked().map(t =>
    `<div class="row ${t.id===me?'me':''}"><span>${h(t.name)}</span><strong>${t.pts}</strong></div>`).join("")
    || `<p class="muted">Nessuna squadra confermata.</p>`;
}
function podium(me, title = "🏆 Classifica"){
  const medal = ["🥇","🥈","🥉"];
  return `<h2 style="text-align:center;margin:8px 0">${h(title)}</h2>` + (ranked().map((t,i) =>
    `<div class="pod ${t.id===me?'pme':''}"><span class="pos">${medal[i]||i+1}</span><span class="pname">${h(t.name)}</span><span class="ppts">${t.pts}</span></div>`).join("")
    || `<p style="text-align:center">Nessuna squadra confermata.</p>`);
}
/* squadre prenotate in ordine di tempo (domande a prenotazione e a indizi) */
function buzzes(q){
  return teams().filter(t => t.confirmed && ST.answers?.[t.id]?.[q.id])
    .map(t => ({...t, t: ST.answers[t.id][q.id].t})).sort((a,b) => a.t - b.t);
}

/* regia: chi ha prenotato, ben visibile, accanto al pulsante per riaprire */
function buzzRow(q){
  const b = buzzes(q);
  const who = b.length
    ? `🔔 <strong>${h(b[0].name)}</strong> ha prenotato${b.length > 1 ? `<span class="buzz-next">poi: ${b.slice(1).map(t => h(t.name)).join(", ")}</span>` : ""}`
    : "In attesa di prenotazioni…";
  return `<div class="buzz-row"><div class="buzz-box ${b.length ? "on" : ""}">${who}</div>
    <button class="btn ghost" onclick="clearBuzz()" ${b.length ? "" : "disabled"}>Riapri prenotazioni</button></div>`;
}

/* ---------- immagini: si scaricano solo quando servono ---------- */
const img = (id, cls = "") => id ? `<img class="${cls}" data-img="${h(id)}" alt="">` : "";
function fillImgs(){
  document.querySelectorAll("img[data-img]").forEach(e => {
    const id = e.dataset.img;
    if (IMG[id]) { if (e.src !== IMG[id]) e.src = IMG[id]; }
    else if (IMG[id] === undefined) {
      IMG[id] = null;
      DB.ref("quizImg/" + id).once("value").then(s => { IMG[id] = s.val() || ""; fillImgs(); });
    }
  });
}

/* ---------- tempo ---------- */
function remaining(){
  const c = cfg();
  if (c.phase !== "domanda" || !c.start || c.secs === 0) return null;
  return c.start + (c.secs ?? 30) * 1000 - now();
}
setInterval(() => {
  const r = remaining();
  if (r === null) return;
  const s = Math.max(0, Math.ceil(r / 1000));
  document.querySelectorAll(".tick").forEach(e => e.textContent = s + " s");
  if (r <= 0 && doneKey !== cfg().start) {
    doneKey = cfg().start;
    if (IS_PLAYER) render();
    else if (IS_HOST) DB.ref("quiz/config/phase").set("risposte");
  }
}, 500);

/* ---------- render (preserva i valori degli input) ---------- */
function render(){
  const keep = {};
  document.querySelectorAll("#app input, #app textarea, #app select").forEach(e => { if (e.id && e.type !== "file") keep[e.id] = e.value; });
  document.getElementById("title").textContent = "🎲 " + quizName() + (DEMO ? " · prova" : "");
  document.title = quizName();
  document.body.classList.toggle("proj", IS_PROJ);
  const app = document.getElementById("app");
  if (IS_PROJ) app.innerHTML = viewProj();

/* proiettore: tromba a ogni prenotazione (fanfara alla prima, una nota alle successive) e gong quando le risposte si chiudono.
   Il browser blocca i suoni finché non si clicca o si preme un tasto sulla pagina */
let AC = null, buzzSeen = { key: "", n: 0 }, lastQ = { id: "", phase: "" };
const soundOn = () => AC?.state === "running";
function unlockSound(){
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  if (!soundOn()) AC.resume().then(render, () => {});
}
/* ottone: dente di sega con un filtro che si apre all'attacco, vibrato sulle note lunghe */
function trumpet(first){
  if (!soundOn()) return;
  const out = AC.createGain();
  out.gain.value = first ? 0.35 : 0.25;
  out.connect(AC.destination);
  let t = AC.currentTime;
  (first ? [[523, .13], [523, .13], [523, .13], [784, .7]] : [[784, .35]]).forEach(([fr, d]) => {
    const o = AC.createOscillator(), filt = AC.createBiquadFilter(), g = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = "sawtooth"; o.frequency.value = fr;
    lfo.frequency.value = 5.5; lg.gain.value = d > .3 ? 6 : 0; lfo.connect(lg).connect(o.frequency);
    filt.type = "lowpass"; filt.Q.value = 2;
    filt.frequency.setValueAtTime(400, t);
    filt.frequency.exponentialRampToValueAtTime(3200, t + .05);
    filt.frequency.exponentialRampToValueAtTime(1800, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(1, t + .03);
    g.gain.setValueAtTime(1, t + d - .05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d + .08);
    o.connect(filt).connect(g).connect(out);
    o.start(t); o.stop(t + d + .1); lfo.start(t); lfo.stop(t + d + .1);
    t += d + .04;
  });
}
/* gong: parziali non armoniche che si spengono a velocità diverse, più il colpo del battente */
function gong(){
  if (!soundOn()) return;
  const t = AC.currentTime, out = AC.createGain();
  out.gain.value = 0.5;
  out.connect(AC.destination);
  [[1, 1, 4], [1.48, .6, 3], [2.13, .45, 2.2], [2.6, .3, 1.6], [3.4, .2, 1.1], [4.7, .12, .7]].forEach(([r, a, d]) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(98 * r * 1.01, t);
    o.frequency.exponentialRampToValueAtTime(98 * r, t + .4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(a, t + .01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(out); o.start(t); o.stop(t + d);
  });
  const n = AC.createBufferSource(), b = AC.createBuffer(1, AC.sampleRate * .08, AC.sampleRate), ch = b.getChannelData(0);
  for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
  const f = AC.createBiquadFilter(), ng = AC.createGain();
  f.type = "lowpass"; f.frequency.value = 900; ng.gain.value = .5;
  n.buffer = b; n.connect(f).connect(ng).connect(out); n.start(t);
}
/* suona solo per cambiamenti visti mentre la pagina è aperta: chi apre o ricarica il proiettore non sente niente */
function projSounds(){
  const c = cfg(), q = curQ();
  /* tempo scaduto o risposte chiuse: la domanda passa da "domanda" a risposte o soluzione */
  if (q && lastQ.id === q.id && lastQ.phase === "domanda" && ["risposte", "soluzione"].includes(c.phase)) gong();
  lastQ = { id: q?.id || "", phase: c.phase };
  /* prenotazioni nuove della stessa domanda: riaprire le prenotazioni o cambiare domanda riparte da zero */
  const key = q && c.phase === "domanda" && isBuzz(q) ? q.id + ":" + (c.clueAt || c.start) : "";
  const n = key ? buzzes(q).length : 0;
  if (key && key === buzzSeen.key && n > buzzSeen.n) trumpet(buzzSeen.n === 0);
  buzzSeen = { key, n };
}

/* ---------- lettura del file Word ---------- */
const LABEL = /^\s*(QUIZ|COPERTINA|CHIUSURA|MANCHE|APERTURA|TIPO|PUNTI|TEMPO|TITOLO|DOMANDA|INDIZIO|AIUTO|RISPOSTA|NOTE)\s*:\s*(.*)$/i;
const OPTION = /^\s*([A-H])\s*[\)\.\-–:]\s+(.+)$/;
function typeOf(v){
  v = v.toLowerCase();
  if (v.includes("indizi")) return "indizi";
  if (v.includes("prenot")) return "prenota";
  if (v.includes("scelta") || v.includes("multipla")) return "scelta";
  if (v.includes("testo") || v.includes("scritta") || v.includes("libera")) return "testo";
  return "";
}
async function parseDocx(file){
  const zip = await JSZip.loadAsync(file);
  const docXml = await zip.file("word/document.xml")?.async("string");
  if (!docXml) throw new Error("questo non sembra un file Word (.docx)");
  const relXml = await zip.file("word/_rels/document.xml.rels")?.async("string") || "";
  const rels = {};
  new DOMParser().parseFromString(relXml, "application/xml").querySelectorAll("Relationship")
    .forEach(r => rels[r.getAttribute("Id")] = "word/" + r.getAttribute("Target").replace(/^\/?word\//, "").replace(/^\//, ""));
  const doc = new DOMParser().parseFromString(docXml, "application/xml");
  const body = doc.getElementsByTagName("w:body")[0];
  const paras = [...body.getElementsByTagName("w:p")].map(p => {
    let text = "";
    const imgs = [];
    for (const n of p.getElementsByTagName("*")) {
      if (n.nodeName === "w:t") text += n.textContent;
      else if (n.nodeName === "w:tab" || n.nodeName === "w:br") text += " ";
      else if (n.nodeName === "a:blip" && n.getAttribute("r:embed")) imgs.push(rels[n.getAttribute("r:embed")]);
      else if (n.nodeName === "v:imagedata" && n.getAttribute("r:id")) imgs.push(rels[n.getAttribute("r:id")]);
    }
    return { text: text.replace(/\s+/g, " ").trim(), list: p.getElementsByTagName("w:numPr").length > 0, imgs: imgs.filter(Boolean) };
  });

  const P = { name: "", cover: "", end: "", rounds: [], errors: [], warnings: [] };
  let round = null, q = null, field = "", slot = "", nq = 0;
  const where = () => q ? `Domanda ${nq} (${round.title})` : round ? `Manche "${round.title}"` : "Inizio file";
  const num = (v, what) => { const n = parseInt(v, 10); if (isNaN(n) || n < 0) { P.errors.push(`${where()}: ${what} "${v}" non è un numero`); return null; } return n; };
  for (const p of paras) {
    for (const src of p.imgs) {
      if (slot === "COPERTINA" && !P.cover) P.cover = src;
      else if (slot === "CHIUSURA" && !P.end) P.end = src;
      else if (slot === "APERTURA" && round && !round.cover) round.cover = src;
      else if (q) q.images.push(src);
      else if (round && !round.cover) round.cover = src;
      else P.warnings.push(`${where()}: un'immagine non appartiene a nessuna domanda ed è stata ignorata`);
    }
    if (p.imgs.length) slot = "";
    const t = p.text;
    if (!t || t.startsWith("//")) continue;
    const m = t.match(LABEL);
    if (m) {
      const key = m[1].toUpperCase(), val = m[2].trim();
      field = key; slot = "";
      if (key === "QUIZ") P.name = val;
      else if (key === "COPERTINA" || key === "CHIUSURA" || key === "APERTURA") slot = key;
      else if (key === "MANCHE") { round = { title: val || "Manche", type: "", points: 2, secs: 30, cover: "", questions: [] }; P.rounds.push(round); q = null; }
      else if (!round) P.errors.push(`"${key}:" compare prima della prima MANCHE`);
      else if (key === "TIPO") { const ty = typeOf(val); if (!ty) P.errors.push(`${where()}: tipo "${val}" sconosciuto (usa scelta, prenotazione, indizi o testo)`); (q || round).type = ty; }
      else if (key === "PUNTI") { const n = num(val, "PUNTI"); if (n !== null) (q || round).points = n; }
      else if (key === "TEMPO") { const n = num(val, "TEMPO"); if (n !== null) (q || round).secs = n; }
      else if (key === "TITOLO") { round._cat = val; }
      else if (key === "DOMANDA") {
        nq++;
        q = { text: val, cat: round._cat || "", options: [], clues: [], images: [], answer: "", hint: "", notes: "" };
        round._cat = "";
        round.questions.push(q);
      }
      else if (!q) P.errors.push(`${where()}: "${key}:" compare prima di una DOMANDA`);
      else if (key === "INDIZIO") q.clues.push(val);
      else if (key === "AIUTO") q.hint = val;
      else if (key === "RISPOSTA") q.answer = val;
      else if (key === "NOTE") q.notes = val;
      continue;
    }
    const o = t.match(OPTION);
    if (q && (o || p.list) && field !== "NOTE" && field !== "AIUTO") {
      if ((q.type || round.type) === "indizi") q.clues.push(o ? o[2] : t);
      else q.options.push(o ? o[2] : t);
      field = "OPZIONE";
      continue;
    }
    /* riga senza etichetta: continua il campo precedente */
    if (q && field === "DOMANDA") q.text += " " + t;
    else if (q && field === "NOTE") q.notes += " " + t;
    else if (q && field === "AIUTO") q.hint += " " + t;
    else if (q && field === "RISPOSTA") q.answer += " " + t;
    else P.warnings.push(`${where()}: riga ignorata: "${t.slice(0,60)}"`);
  }

  nq = 0;
  P.rounds.forEach(r => {
    if (!r.type) P.errors.push(`Manche "${r.title}": manca TIPO`);
    if (!r.questions.length) P.warnings.push(`Manche "${r.title}": nessuna domanda`);
    r.questions.forEach(q => {
      nq++;
      const w = `Domanda ${nq} (${r.title})`;
      q.type = q.type || r.type;
      q.points = q.points ?? r.points;
      q.secs = q.secs ?? r.secs;
      q.correct = -1;
      if (!q.text) P.errors.push(`${w}: manca il testo`);
      if (!q.answer) P.errors.push(`${w}: manca RISPOSTA`);
      else if (/da compilare/i.test(q.answer)) P.warnings.push(`${w}: risposta ancora da compilare`);
      if (q.type === "scelta") {
        if (q.options.length < 2) P.errors.push(`${w}: servono almeno due opzioni (A) B) ...)`);
        const a = q.answer.trim();
        let i = /^[A-H]\b/i.test(a) && (a.length === 1 || /^[A-H]\s*[\)\.\-–:]/i.test(a)) ? LETTERS.indexOf(a[0].toUpperCase()) : -1;
        if (i < 0) i = q.options.findIndex(o => o.toLowerCase() === a.toLowerCase());
        if (i < 0 || i >= q.options.length) P.errors.push(`${w}: la RISPOSTA "${a}" non corrisponde a nessuna opzione`);
        else { q.correct = i; q.answer = LETTERS[i] + ") " + q.options[i]; }
      }
      if (q.type === "indizi" && !q.clues.length) P.errors.push(`${w}: servono degli INDIZIO`);
    });
  });
  if (!nq) P.errors.push("Nel file non c'è nessuna DOMANDA");
  return { P, zip };
}

/* ridimensiona un'immagine del Word e la trasforma in JPEG compatto */
async function shrink(blob){
  const url = URL.createObjectURL(blob);
  try {
    const im = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error("immagine non leggibile")); i.src = url; });
    const max = DEMO ? 800 : 1600;
    const sc = Math.min(1, max / im.width, max / im.height);
    const cv = document.createElement("canvas");
    cv.width = Math.round(im.width * sc);
    cv.height = Math.round(im.height * sc);
    const g = cv.getContext("2d");
    g.fillStyle = "#000"; g.fillRect(0, 0, cv.width, cv.height);
    g.drawImage(im, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", DEMO ? 0.6 : 0.8);
  } finally { URL.revokeObjectURL(url); }
}

function setUpMsg(html){ upMsg = html; const e = document.getElementById("upMsg"); if (e) e.innerHTML = html; }
async function loadDocx(file){
  if (!file) return;
  try {
    setUpMsg("Lettura del file…");
    const { P, zip } = await parseDocx(file);
    const list = (a, cls) => a.length ? `<ul class="${cls}">${a.map(x => `<li>${h(x)}</li>`).join("")}</ul>` : "";
    const nq = P.rounds.reduce((n,r) => n + r.questions.length, 0);
    if (P.errors.length) return setUpMsg(`<p class="msg-err"><strong>Il file non è stato caricato. Da correggere:</strong></p>${list(P.errors, "msg-err")}${list(P.warnings, "msg-warn")}`);
    const warn = playing() ? "⚠ C'È UNA PARTITA IN CORSO: punti e risposte andranno persi e si ripartirà dalla copertina.\n\n" : "";
    if (!confirm(`${warn}Caricare "${P.name || quizName()}": ${P.rounds.length} manche, ${nq} domande?\nDomande, risposte e punteggi attuali verranno sostituiti; le squadre restano.`)) return setUpMsg("");

    /* immagini: una per volta, ognuna nel suo nodo */
    const paths = [...new Set([P.cover, P.end, ...P.rounds.flatMap(r => [r.cover, ...r.questions.flatMap(q => q.images)])].filter(Boolean))];
    const ids = {};
    await DB.ref("quizImg").remove();
    for (let i = 0; i < paths.length; i++) {
      setUpMsg(`Caricamento immagini ${i+1}/${paths.length}…`);
      const f = zip.file(paths[i]);
      if (!f) continue;
      ids[paths[i]] = uid();
      await DB.ref("quizImg/" + ids[paths[i]]).set(await shrink(await f.async("blob")));
    }
    const up = { "quiz/answers": null, "quiz/reveal": null, "quiz/config": { phase: "copertina", idx: 0 },
      "quiz/settings/name": P.name || quizName(), "quiz/settings/cover": ids[P.cover] || null, "quiz/settings/end": ids[P.end] || null };
    const rounds = {}, questions = {}, secret = {};
    let order = 0;
    P.rounds.forEach((r, ri) => {
      const rid = uid() + ri;
      rounds[rid] = { order: ri, title: r.title, type: r.type, cover: ids[r.cover] || "" };
      r.questions.forEach(q => {
        const qid = uid() + order;
        questions[qid] = { order: order++, round: rid, type: q.type, text: q.text, cat: q.cat, points: q.points, secs: q.secs,
          options: q.options.join("|"), clues: q.clues, images: q.images.map(p => ids[p]).filter(Boolean), hasHint: !!q.hint };
        secret[qid] = { answer: q.answer, correct: q.correct, hint: q.hint, notes: q.notes };
      });
    });
    up["quiz/rounds"] = rounds;
    up["quiz/questions"] = questions;
    up["quizSecret"] = secret;
    await DB.ref().update(up);
    setUpMsg(`<p style="color:var(--ok)"><strong>Caricate ${nq} domande in ${P.rounds.length} manche.</strong></p>${list(P.warnings, "msg-warn")}`);
  } catch(e) {
    setUpMsg(`<p class="msg-err">Errore: ${h(e.message)}</p>`);
  }
}

}

/* ---------- regia: una sequenza fissa, un solo pulsante principale ----------
   copertina → iscrizione → intro (apertura manche) → domanda → risposte → soluzione → … →
   parziale (classifica di fine manche) → intro della manche dopo → … → classifica → fine */
const setConfig = obj => DB.ref("quiz/config").update(obj).catch(e => alert("Errore Firebase: " + e.message));
const posInRound = q => qs().filter(x => x.round === q.round).findIndex(x => x.id === q.id) + 1;
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
/* risposta giusta: per le scelte confronta l'opzione, per le risposte scritte il testo (senza maiuscole, accenti e punteggiatura) */
function isRight(q, value){
  const sec = SECRET[q.id] || {};
  if (value == null) return false;
  if (q.type === "scelta") return sec.correct >= 0 && value === qOpts(q)[sec.correct];
  if (q.type === "testo") return !!norm(sec.answer) && norm(value) === norm(sec.answer);
  return false;
}
const playing = () => !["copertina", "iscrizione", "attesa"].includes(cfg().phase) || qs().some(q => Object.keys(q.awarded || {}).length);

function nextStep(){
  const c = cfg(), l = qs(), n = l.length;
  const i = Math.min(Math.max(c.idx || 0, 0), Math.max(n - 1, 0)), q = l[i];
  const pending = teams().filter(t => !t.confirmed);
  /* niente si avvia finché ci sono squadre da sistemare */
  const gate = !n ? "Carica prima le domande dalla scheda Domande."
    : pending.length ? "Prima conferma o elimina le squadre in attesa (riquadro qui sopra)."
    : !teams().length ? "Aspetta che almeno una squadra si iscriva." : "";
  const nextRound = i + 1 < n && l[i + 1].round !== q.round;
  switch (c.phase) {
    case "copertina":
      return { text: "Sul proiettore c'è la copertina e le iscrizioni sono chiuse. Quando sei pronto aprile: comparirà il QR.",
        label: "Apri le iscrizioni", why: n ? "" : "Carica prima le domande dalla scheda Domande.", run: () => setConfig({ phase: "iscrizione" }) };
    case "iscrizione":
    case "attesa":
      return { text: c.phase === "iscrizione" ? "Iscrizioni aperte: le squadre si registrano inquadrando il QR sul proiettore. Conferma ogni squadra quando arriva." : "Partita in pausa.",
        label: c.phase === "iscrizione" ? `Chiudi le iscrizioni e apri "${roundOf(q).title || "la prima manche"}"` : `Riprendi: apri "${roundOf(q).title || "la manche"}"`,
        why: gate, run: () => setConfig({ phase: "intro", idx: i }) };
    case "intro":
      return { text: `Sul proiettore c'è l'apertura della manche "${roundOf(q).title}". Presentala, poi avvia la domanda.`,
        label: `▶ Avvia la domanda ${posInRound(q)}`, why: gate, run: () => goQ(i) };
    case "domanda":
      if (q.type === "indizi") return { text: "Svela gli indizi uno alla volta. Quando una squadra prenotata indovina, assegnale i punti qui sotto, poi mostra la soluzione.", label: "Mostra la soluzione", run: showSol };
      if (q.type === "prenota") return { text: "Le squadre si prenotano. Ascolta chi ha premuto per primo: se indovina assegnagli i punti, se sbaglia riapri le prenotazioni.", label: "Mostra la soluzione", run: showSol };
      {
        const conf = teams().filter(t => t.confirmed), done = conf.filter(t => ST.answers?.[t.id]?.[q.id]).length;
        /* tutte le squadre hanno risposto: inutile aspettare il timer */
        if (conf.length && done === conf.length)
          return { text: `<span class="all-in">✅ Tutte le squadre hanno risposto (${done}/${conf.length}): puoi chiudere le risposte.</span>`, label: "Chiudi le risposte", hot: true, run: () => setConfig({ phase: "risposte" }) };
        return { text: `${done === 1 ? "Ha" : "Hanno"} risposto <strong>${done} ${done === 1 ? "squadra" : "squadre"} su ${conf.length}</strong>. ` + (qSecs(q) ? "Il tempo chiude da solo; puoi anche chiudere prima." : "Questa domanda non ha timer: chiudi tu quando sono pronte."),
          label: "Chiudi le risposte", run: () => setConfig({ phase: "risposte" }) };
      }
    case "risposte":
      return { text: q.type === "testo"
          ? "Risposte chiuse. Le risposte identiche alla soluzione prendono i punti da sole quando la mostri; quelle giuste ma scritte diversamente premiale tu qui sotto."
          : "Risposte chiuse. Quando mostri la soluzione le squadre che hanno indovinato prendono i punti da sole.",
        label: "Mostra la soluzione", run: showSol };
    case "soluzione":
      if (i >= n - 1) return { text: "Ultima soluzione sul proiettore. Controlla i punti: poi c'è la classifica finale.", label: "🏆 Classifica finale", run: () => setConfig({ phase: "classifica" }) };
      if (nextRound) return { text: "Soluzione sul proiettore. Questa era l'ultima domanda della manche.", label: "Classifica di fine manche", run: () => setConfig({ phase: "parziale" }) };
      return { text: "Soluzione sul proiettore. Controlla i punti, poi vai avanti.", label: `Domanda successiva (${posInRound(l[i + 1])} di ${qs().filter(x => x.round === q.round).length}) →`, why: gate, run: () => goQ(i + 1) };
    case "parziale":
      return { text: `Classifica di fine manche sul proiettore.`, label: `Apri la manche "${roundOf(l[i + 1]).title}"`, why: gate, run: () => setConfig({ phase: "intro", idx: i + 1 }) };
    case "classifica":
      return { text: "Classifica finale sul proiettore. Proclama i vincitori!", label: "Chiudi la serata", run: () => setConfig({ phase: "fine" }) };
    default:
      return { text: "Serata conclusa. 🎉 Per giocare di nuovo vai nella scheda Domande, riquadro \"Ripartire da capo\".", label: "" };
  }
}
/* la pagina si ridisegna subito dopo un clic: senza questa pausa il secondo clic di un doppio clic
   cadrebbe sul pulsante nuovo nello stesso punto e farebbe saltare un passo */
const lastClick = {};
const tooFast = key => { const t = Date.now(), last = lastClick[key] || 0; lastClick[key] = t; return t - last < 1000; };
/* il pulsante passa anche fase e domanda che vedeva: se nel frattempo sono cambiate non fa nulla */
function doNext(phase, idx){
  const c = cfg();
  if (tooFast("next") || c.phase !== phase || (c.idx || 0) !== idx) return;
  const s = nextStep();
  if (s.why || !s.run) return;
  document.querySelectorAll(".next-btn").forEach(b => b.disabled = true);
  s.run();
}

function hostGame(){
  const c = cfg(), l = qs(), n = l.length, q = curQ(), ph = c.phase;
  const sec = q ? SECRET[q.id] || {} : {};
  const rv = reveal(q);
  const cl = c.clues || 1;
  const s = nextStep();

  /* le squadre non confermate non vedono le domande e bloccano la partita: si sistemano qui */
  const pending = teams().filter(t => !t.confirmed);
  const waiting = pending.length ? `
    <div class="card" style="border-color:var(--warn)">
      <strong class="msg-warn">⚠ ${pending.length === 1 ? "1 squadra aspetta" : pending.length + " squadre aspettano"} la conferma</strong>
      <p class="muted" style="margin:4px 0">Finché non le confermi (o le elimini) non vedono le domande e la partita non va avanti.</p>
      ${pending.map(t => `<div class="row"><span><strong>${h(t.name)}</strong>${t.members ? `<br><span class="muted">${h(t.members)}</span>` : ""}</span>
        <span><button class="btn ok" onclick="toggleTeam('${t.id}')">Conferma</button><button class="btn danger" onclick="delTeam('${t.id}')">✕</button></span></div>`).join("")}
    </div>` : "";

  const where = q && !["copertina", "iscrizione", "attesa", "classifica", "fine"].includes(ph)
    ? `<div class="step">Manche ${Object.values(ST.rounds || {}).filter(r => r.order <= roundOf(q).order).length}/${Object.keys(ST.rounds || {}).length} · ${h(roundOf(q).title)} · domanda ${posInRound(q)}/${l.filter(x => x.round === q.round).length}</div>` : "";
  const timer = ph === "domanda" && q && qSecs(q) ? ` <span class="tag">⏱ <span class="tick"></span></span>` : "";
  /* azioni che servono solo in questa fase della domanda */
  const tools = q && ph === "domanda" ? [
    q.type === "indizi" ? `<button class="btn" onclick="nextClue()" ${cl >= qClues(q).length ? "disabled" : ""}>Svela indizio ${Math.min(cl + 1, qClues(q).length)} di ${qClues(q).length}</button>` : "",
    isBuzz(q) ? buzzRow(q) : "",
    q.hasHint ? `<button class="btn ghost" onclick="showHint()" ${rv.hint ? "disabled" : ""}>${rv.hint ? "Aiuto mostrato" : "Mostra aiuto"}</button>` : ""
  ].join("") : "";
  const regia = `
    <div class="card regia">
      ${where}
      <p style="margin:6px 0 10px">${s.text}${timer}</p>
      ${tools ? `<div style="margin-bottom:8px">${tools}</div>` : ""}
      ${s.label ? `<button class="btn next-btn ${s.hot ? "hot" : ""}" onclick="doNext('${ph}', ${c.idx || 0})" ${s.why ? "disabled" : ""}>${h(s.label)}</button>` : ""}
      ${s.why ? `<p class="msg-warn" style="margin:6px 0 0"><strong>${s.why}</strong></p>` : ""}
    </div>`;

  if (!n) return waiting + regia;

  const showQ = !["copertina", "iscrizione", "attesa", "classifica", "fine"].includes(ph);
  let body = "";
  if (ph === "copertina" || ph === "iscrizione" || ph === "attesa") {
    body = `<div class="card"><strong>Squadre iscritte</strong>${teams().map(t => `<div class="row"><span>${h(t.name)}</span><span class="tag ${t.confirmed ? "good" : ""}">${t.confirmed ? "confermata" : "in attesa"}</span></div>`).join("") || `<p class="muted">Ancora nessuna. Il QR è sul proiettore e nella scheda QR.</p>`}</div>`;
  }
  if (showQ) {
    const list = isBuzz(q) ? buzzes(q).concat(teams().filter(t => t.confirmed && !ST.answers?.[t.id]?.[q.id])) : teams().filter(t => t.confirmed);
    const from = c.clueAt || c.start;
    const canAward = ["domanda", "risposte", "soluzione"].includes(ph);
    const answers = list.map((t,i) => {
      const a = ST.answers?.[t.id]?.[q.id];
      const on = q.awarded?.[t.id];
      const info = isBuzz(q) && a ? `${i+1}° · ${((a.t - (from || a.t)) / 1000).toFixed(2)} s` : "";
      return `<div class="row"><div><strong>${h(t.name)}</strong>${info ? ` <span class="tag">${info}</span>` : ""}${a && isRight(q, a.value) ? ` <span class="tag good">esatta</span>` : ""}<br><span class="muted">${a ? h(a.value) : "— nessuna risposta"}</span></div>
        ${canAward ? `<button class="btn ${on?'ok':'ghost'}" onclick="award('${t.id}')">${on ? '✓ ' + awardVal(q, on) + ' pt' : '+ ' + ptsNow(q)}</button>` : ""}</div>`;
    }).join("") || `<p class="muted">Nessuna squadra confermata.</p>`;
    const anyRight = list.some(t => isRight(q, ST.answers?.[t.id]?.[q.id]?.value) && !q.awarded?.[t.id]);
    const opts = qOpts(q).map((o,i) => `<div class="${i === sec.correct ? "" : "muted"}">${i === sec.correct ? "✅ " : ""}${LETTERS[i]}) ${h(o)}</div>`).join("");
    const clues = qClues(q).map((x,i) => `<div class="${i < cl || ph === "soluzione" ? "" : "muted"}">${i < cl ? "👁 " : ""}${i+1}. ${h(x)}</div>`).join("");
    body = `
    <div class="card">
      <span class="tag">${TYPE_NAMES[q.type] || q.type} · ${q.type === "indizi" ? `vale ${ptsNow(q)} pt ora` : q.points + " pt"}</span>
      ${q.cat ? `<div class="muted" style="margin-top:6px">${h(q.cat)}</div>` : ""}
      <div class="big">${h(q.text)}</div>
      ${qImgs(q).length ? `<div class="thumbs">${qImgs(q).map(id => img(id)).join("")}</div>` : ""}
      ${opts}${clues}
      <p>Risposta: <strong class="${/da compilare/i.test(sec.answer || "") ? "msg-err" : ""}">${h(sec.answer)}</strong></p>
      ${sec.hint ? `<p class="muted">Aiuto: ${h(sec.hint)}</p>` : ""}
      ${sec.notes ? `<p class="muted">Note: ${h(sec.notes)}</p>` : ""}
    </div>
    ${ph === "intro" ? "" : `<div class="card"><strong>Risposte e punti</strong>
      ${canAward && anyRight ? `<button class="btn ok" style="float:right" onclick="awardRight()">Punti a tutte le esatte</button>` : ""}
      ${answers}</div>`}`;
  }
  return waiting + regia + body + `<div class="card"><strong>Classifica</strong>${board()}</div>` + fixCard();
}

/* ---------- correzioni: fuori dal flusso normale, sempre con conferma ---------- */
function fixCard(){
  const c = cfg(), l = qs(), i = c.idx || 0;
  return `<details class="card fix"><summary><strong>Correzioni</strong> <span class="muted">— solo se qualcosa è andato storto</span></summary>
    <div style="margin-top:8px">
      <button class="btn ghost" onclick="fixBack()" ${i <= 0 || ["copertina", "iscrizione"].includes(c.phase) ? "disabled" : ""}>← Torna alla domanda precedente</button>
      <button class="btn ghost" onclick="fixRepeat()" ${["domanda","risposte","soluzione"].includes(c.phase) ? "" : "disabled"}>↻ Ripeti questa domanda</button>
      <button class="btn ghost" onclick="fixReopen()" ${["copertina", "iscrizione"].includes(c.phase) ? "disabled" : ""}>Riapri le iscrizioni</button>
    </div>
    <div class="row" style="margin-top:6px"><select id="fixTo">${l.map((x,j) => `<option value="${j}" ${j === i ? "selected" : ""}>${j+1}. ${h(roundOf(x).title)} – ${h((x.cat ? x.cat + ": " : "") + x.text).slice(0,50)}</option>`).join("")}</select>
      <button class="btn ghost" onclick="fixJump()">Vai</button></div>
    <p class="muted" style="margin:8px 0 0">Per ricominciare da zero c'è "Ripartire da capo" nella scheda Domande.</p>
  </details>`;
}
function fixBack(){
  const i = (cfg().idx || 0) - 1;
  if (i < 0 || !confirm("Tornare alla domanda precedente? Potrai correggere i punti e rimostrare la soluzione.")) return;
  setConfig({ phase: "risposte", idx: i });
}
function fixRepeat(){
  const q = curQ();
  if (!q || !confirm("Ripetere questa domanda da capo? Risposte e punti di questa domanda vengono cancellati.")) return;
  const up = { [`quiz/questions/${q.id}/awarded`]: null };
  teams().forEach(t => up[`quiz/answers/${t.id}/${q.id}`] = null);
  DB.ref().update(up).then(() => goQ(cfg().idx || 0));
}
function fixReopen(){
  if (!confirm("Riaprire le iscrizioni? La partita resta in pausa con i punti attuali; poi riprendi dal pulsante principale.")) return;
  setConfig({ phase: "iscrizione" });
}
function fixJump(){
  const j = Number(document.getElementById("fixTo").value), q = qs()[j];
  if (!q || !confirm(`Saltare alla domanda ${j+1} ("${q.text.slice(0,40)}")? Si riparte dall'apertura della sua manche.`)) return;
  setConfig({ phase: "intro", idx: j });
}
/* ---------- ripartire da capo (scheda Domande) ---------- */
function resetCard(){
  const nt = teams().length;
  return `<div class="card">
    <strong>Ripartire da capo</strong>
    <p class="muted">Le domande caricate restano. Si torna alla copertina, con le iscrizioni chiuse.</p>
    <button class="btn ghost" onclick="resetGame(false)">↻ Nuova partita con le stesse squadre</button>
    <button class="btn danger" onclick="resetGame(true)" ${nt ? "" : "disabled"}>🗑 Azzera tutto, squadre comprese</button>
    <p class="muted" style="margin:6px 0 0">"Nuova partita" cancella punti e risposte. "Azzera tutto" cancella anche le ${nt} squadre iscritte: i concorrenti dovranno iscriversi di nuovo.</p>
  </div>`;
}
function resetGame(withTeams){
  if (withTeams) {
    const typed = prompt(`Stai per cancellare punti, risposte e TUTTE le ${teams().length} squadre.\nPer confermare scrivi AZZERA:`);
    if (typed === null) return;
    if (typed.trim().toUpperCase() !== "AZZERA") return alert("Non hai scritto AZZERA: non ho cancellato niente.");
  } else if (!confirm("Nuova partita: tutti i punti e tutte le risposte vengono cancellati. Domande e squadre restano. Continuare?")) return;
  const up = { "quiz/answers": null, "quiz/reveal": null, "quiz/config": { phase: "copertina", idx: 0 } };
  qs().forEach(q => up[`quiz/questions/${q.id}/awarded`] = null);
  if (withTeams) up["quiz/teams"] = null;
  DB.ref().update(up).then(() => { tab = "Gioco"; render(); });
}

/* avvia una domanda da zero: niente risposte o soluzioni rimaste da prima */
function goQ(i){
  const l = qs(); if (!l.length) return;
  i = Math.min(Math.max(i, 0), l.length - 1);
  const up = { "quiz/config": {phase: "domanda", idx: i, start: TS, clueAt: TS, clues: 1, secs: qSecs(l[i])} };
  up["quiz/reveal/" + l[i].id] = null;
  teams().forEach(t => up[`quiz/answers/${t.id}/${l[i].id}`] = null);
  return DB.ref().update(up);
}
function award(tid){
  const q = curQ();
  const on = q.awarded?.[tid];
  DB.ref("quiz/questions/" + q.id + "/awarded/" + tid).set(on ? null : ptsNow(q));
}
function awardRight(){
  const q = curQ(), up = {};
  teams().filter(t => t.confirmed && isRight(q, ST.answers?.[t.id]?.[q.id]?.value))
    .forEach(t => up[`quiz/questions/${q.id}/awarded/${t.id}`] = ptsNow(q));
  if (Object.keys(up).length) DB.ref().update(up);
}
function clearBuzz(){
  const q = curQ(), up = {};
  teams().forEach(t => up[`quiz/answers/${t.id}/${q.id}`] = null);
  up["quiz/config/clueAt"] = TS;
  return DB.ref().update(up);
}
/* nuovo indizio: le prenotazioni si azzerano e il valore della domanda scende */
function nextClue(){
  const q = curQ(), c = cfg();
  if (tooFast("clue") || c.phase !== "domanda" || (c.clues || 1) >= qClues(q).length) return;
  const up = { "quiz/config/clues": (c.clues || 1) + 1, "quiz/config/clueAt": TS };
  teams().forEach(t => up[`quiz/answers/${t.id}/${q.id}`] = null);
  DB.ref().update(up);
}
function showHint(){ const q = curQ(); DB.ref(`quiz/reveal/${q.id}/hint`).set((SECRET[q.id] || {}).hint || ""); }
function showSol(){
  const q = curQ(), sec = SECRET[q.id] || {};
  const up = {};
  up[`quiz/reveal/${q.id}/answer`] = sec.answer || "";
  up[`quiz/reveal/${q.id}/correct`] = sec.correct ?? -1;
  up[`quiz/reveal/${q.id}/notes`] = sec.notes || "";
  up["quiz/config/phase"] = "soluzione";
  /* le risposte esatte prendono i punti da sole; il presentatore può sempre toglierli o darne altri */
  teams().filter(t => t.confirmed && !q.awarded?.[t.id] && isRight(q, ST.answers?.[t.id]?.[q.id]?.value))
    .forEach(t => up[`quiz/questions/${q.id}/awarded/${t.id}`] = ptsNow(q));
  DB.ref().update(up);
}

/* ---------- PROIETTORE ---------- */
function viewProj(){
  const c = cfg(), q = curQ(), ph = c.phase;
  const corner = `<div class="pj-board comic-box"><h3>Classifica</h3>${ranked().map(t => `<div><span>${h(t.name)}</span><strong>${t.pts}</strong></div>`).join("") || "<div>Nessuna squadra</div>"}</div>`;
  const fs = (soundOn() ? "" : `<button class="pj-snd" onclick="unlockSound()">🔇 Clicca qui per attivare il suono</button>`)
    + (document.fullscreenElement ? "" : `<button class="pj-fs" onclick="document.documentElement.requestFullscreen()">schermo intero</button>`);
  const full = (id, cap) => `<div class="pj-full">${img(id)}${cap ? `<div class="pj-cap">${h(cap)}</div>` : ""}</div>`;
  /* prima delle iscrizioni: solo la copertina, niente QR né classifica */
  if (ph === "copertina") return (ST.settings?.cover ? full(ST.settings.cover) : `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">${h(quizName())}</div></div></div>`) + fs;
  if (ph === "iscrizione") {
    const names = teams().map(t => `<span>${h(t.name)}${t.confirmed ? " ✓" : ""}</span>`).join("");
    return `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">${h(quizName())}</div>
      <div class="pj-tag">Inquadra il codice per iscrivere la tua squadra</div><div class="qr" data-qr="${h(link("p=1"))}" data-size="320"></div>
      <div class="pj-teams">${names}</div></div></div>` + fs;
  }
  if (ph === "fine") return ST.settings?.end ? full(ST.settings.end) + fs : `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">Grazie per aver giocato!</div></div></div>` + fs;
  if (ph === "classifica") return `<div class="pj"><div class="pj-center"><div class="pj-pod">${podium("", "🏆 Classifica finale")}</div></div></div>` + fs;
  if (ph === "parziale" && q) return `<div class="pj"><div class="pj-center"><div class="pj-pod">${podium("", "Classifica dopo: " + (roundOf(q).title || ""))}</div></div></div>` + fs;
  if (!q || ph === "attesa") return (ST.settings?.cover ? full(ST.settings.cover) : `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">${h(quizName())}</div></div></div>`) + corner + fs;
  const r = roundOf(q);
  if (ph === "intro") return (r.cover ? full(r.cover, r.title) : `<div class="pj"><div class="pj-center"><div class="pj-title comic-title">${h(r.title)}</div></div></div>`) + fs;

  const rv = reveal(q);
  const cl = c.clues || 1;
  const inRound = qs().filter(x => x.round === q.round);
  const pos = inRound.findIndex(x => x.id === q.id) + 1;
  const imgs = qImgs(q).length ? `<div class="pj-imgs ${qImgs(q).length === 1 ? "one" : ""}">${qImgs(q).map(id => img(id)).join("")}</div>` : "";
  const opts = qOpts(q).length ? `<div class="pj-opts ${qOpts(q).some(o => o.length > 60) ? "long" : ""}">${qOpts(q).map((o,i) =>
    `<div class="pj-opt ${rv.answer ? (i === rv.correct ? "right" : "dim") : ""}" style="${optStyle(i)}">${LETTERS[i]}) ${h(o)}</div>`).join("")}</div>` : "";
  const clues = q.type === "indizi" ? `<ul class="pj-clues">${qClues(q).slice(0, rv.answer ? qClues(q).length : cl).map((x,i) => `<li><b>${i+1}</b>${h(x)}</li>`).join("")}</ul>
    ${rv.answer ? "" : `<div>Vale <strong>${ptsNow(q)}</strong> punti · indizio ${cl} di ${qClues(q).length}</div>`}` : "";
  const bz = isBuzz(q) && !rv.answer ? buzzes(q) : [];
  const buzz = bz.length ? `<div class="pj-buzz">🔔 ${bz.map((t,i) => i ? h(t.name) : `<strong>${h(t.name)}</strong>`).join(" · ")}</div>` : "";
  const hint = rv.hint && !rv.answer ? `<div class="pj-box pj-hint">💡 ${h(rv.hint)}</div>` : "";
  /* nelle domande a scelta l'opzione giusta è già evidenziata: basta la lettera */
  const solText = q.type === "scelta" && rv.correct >= 0 ? "Risposta " + LETTERS[rv.correct] : rv.answer;
  const sol = rv.answer ? `<div class="pj-box pj-sol">✅ ${h(solText)}${rv.notes ? `<div class="n">${h(rv.notes)}</div>` : ""}</div>` : "";
  const left = remaining();
  const timer = ph === "domanda" && qSecs(q) ? `<span class="pj-timer tick">${left === null ? "" : Math.max(0, Math.ceil(left / 1000)) + " s"}</span>` : ph === "risposte" && !rv.answer ? `<span class="pj-timer">Tempo!</span>` : "";
  return `<div class="pj"><div class="pj-top"><span class="pj-tag">${h(r.title || "")} · ${pos}/${inRound.length}</span>${timer}</div>
    <div class="pj-main comic-box">
      ${q.cat ? `<div class="pj-cat">${h(q.cat)}</div>` : ""}
      <div class="pj-q ${q.text.length > 110 ? "long" : ""}">${h(q.text)}</div>
      ${imgs}${opts}${clues}${buzz}${hint}${sol}
    </div></div>` + corner + fs;
}

/* ---------- CONCORRENTE: pulsantiera ---------- */
const WAIT_MSGS = [
  "🧠 Siete dentro! Fate stretching ai neuroni: si parte tra poco.",
  "📚 Iscrizione ricevuta! Ripassate le tabelline, tra poco si fa sul serio.",
  "😎 Ci siete! Il cervellone vi sta già giudicando… si parte a breve.",
  "🤫 Squadra registrata. Ultima occasione per cercare tutto su Google: tra poco non si potrà più."
];
/* scelta casuale ma fissa per squadra: la pagina si ridisegna spesso e il messaggio non deve cambiare ogni volta */
const pick = (list, key) => list[[...String(key)].reduce((n, c) => (n * 31 + c.charCodeAt(0)) >>> 0, 0) % list.length];
function viewPlayer(){
  const me = myTeam && ST.teams?.[myTeam];
  const c = cfg();
  if ((!myTeam || !me) && c.phase === "copertina") return `<div class="card" style="text-align:center"><p class="big">⏳ Le iscrizioni non sono ancora aperte</p><p>Tra poco il presentatore le apre: questa pagina si aggiorna da sola.</p></div>`;
  if (!myTeam || !me) return bookingForm();
  const head = `<div class="card"><strong>${h(me.name)}</strong></div>`;
  const wait = t => head + `<div class="card" style="text-align:center"><p>${t}</p></div>`;
  if (!me.confirmed) return wait(pick(WAIT_MSGS, myTeam));
  if (["copertina", "iscrizione", "attesa"].includes(c.phase)) return wait("✅ Squadra confermata! Attendi l'inizio del quiz.");
  if (c.phase === "classifica" || c.phase === "fine") return podium(myTeam, c.phase === "fine" ? "🏆 Classifica finale" : "🏆 Classifica");
  const q = curQ();
  if (!q) return wait("In attesa della prima domanda.");
  if (c.phase === "parziale") return podium(myTeam, "Classifica dopo: " + (roundOf(q).title || ""));
  if (c.phase === "intro") return wait(`Sta per iniziare: <strong>${h(roundOf(q).title || "")}</strong>`);
  const mine = ST.answers?.[myTeam]?.[q.id]?.value;
  if (c.phase === "risposte") return head + `<div class="card" style="text-align:center"><p class="big">👀 Tempo scaduto!</p><p>Occhi sul proiettore…</p>${mine && !isBuzz(q) ? `<p class="muted">La vostra risposta: <strong>${h(mine)}</strong></p>` : ""}</div>`;
  if (c.phase === "soluzione") {
    const got = q.awarded?.[myTeam], rv = reveal(q);
    return head + `<div class="card" style="text-align:center">
      ${got ? `<p class="big">🎉 +${awardVal(q, got)} punti!</p>` : `<p class="big">😅 Niente punti stavolta</p>`}
      ${rv.answer ? `<p class="muted">Risposta giusta: <strong>${h(rv.answer)}</strong></p>` : ""}
    </div><div class="card"><strong>Classifica</strong>${board(myTeam)}</div>`;
  }
  const r = remaining();
  const locked = c.phase !== "domanda" || (r !== null && r <= 0);
  const dis = locked ? "disabled" : "";
  const timer = qSecs(q) ? `<div class="tag" style="font-size:1.1rem">⏱ <span class="tick"></span></div>` : "";
  let pad;
  if (isBuzz(q)) {
    const info = q.type === "indizi" ? `<p class="muted">Indizio ${c.clues || 1} di ${qClues(q).length} · vale ${ptsNow(q)} punti</p>` : "";
    pad = info + (mine ? `<p class="big">✅ Sei prenotato: rispondi a voce!</p>`
      : `<button class="btn big-opt" ${dis} onclick="answer('Prenotato')">🔔 PRENOTATI</button>`);
  } else if (q.type === "scelta") {
    pad = qOpts(q).map((o,i) =>
      `<button class="big-opt" style="${optStyle(i)};font-size:1.3rem;padding:24px;font-weight:600;border-radius:12px;text-align:left;border:${mine===o?'4px solid #000':'0'};opacity:${dis?'.5':'1'}" ${dis} data-v="${h(o)}" onclick="answer(this.dataset.v)">${LETTERS[i]}) ${h(o)}</button>`).join("");
  } else {
    pad = `<input id="pAns" placeholder="La tua risposta" ${dis}>
      <button class="btn big-opt" ${dis} onclick="answer(document.getElementById('pAns').value)">Invia risposta</button>`;
  }
  const sent = mine && !isBuzz(q) ? `<p>Inviata: <strong>${h(mine)}</strong></p>` : "";
  return head + `<div class="card" style="text-align:center">${timer}${sent}${pad}</div>`;
}
function answer(v){
  v = String(v ?? "").trim();
  const r = remaining();
  /* la pagina potrebbe essere ancora quella vecchia: a tempo scaduto la risposta non parte */
  if (!v || cfg().phase !== "domanda" || (r !== null && r <= 0) || !ST.teams?.[myTeam]?.confirmed) return;
  DB.ref(`quiz/answers/${myTeam}/${curQ().id}`).set({value: v.slice(0, 200), t: TS});
}
function bookingForm(){
  return `<div class="card">
    <strong>Iscrivi la tua squadra</strong>
    <input id="bName" placeholder="Nome squadra" maxlength="30">
    <input id="bMem" placeholder="Membri (facoltativo)" maxlength="80">
    <button class="btn" onclick="book()">Iscriviti</button>
    <p class="muted">Avete già una squadra ma avete cambiato telefono? Scrivete lo stesso nome per rientrare.</p>
  </div>`;
}
function book(){
  const name = document.getElementById("bName").value.trim().slice(0, 30);
  if (!name || cfg().phase === "copertina") return;
  /* stesso nome = stessa squadra: chi ricarica o cambia telefono rientra invece di creare un doppione */
  const same = teams().find(t => norm(t.name) === norm(name));
  if (same) {
    if (!confirm(`La squadra "${same.name}" esiste già. Siete voi? OK per rientrare, Annulla per scegliere un altro nome.`)) return;
    myTeam = same.id;
    localStorage.setItem("qnTeam", same.id);
    return render();
  }
  const id = uid();
  DB.ref("quiz/teams/" + id).set({ name, members: document.getElementById("bMem").value.trim().slice(0, 80), confirmed: false });
  myTeam = id;
  localStorage.setItem("qnTeam", id);
}

/* ---------- QR ---------- */
function makeQR(){
  document.querySelectorAll("[data-qr]").forEach(el => {
    el.innerHTML = "";
    if (typeof QRCode === "undefined") { el.textContent = "QR non disponibile"; return; }
    const s = Number(el.dataset.size) || 220;
    new QRCode(el, { text: el.dataset.qr, width: s, height: s });
  });
}

render();
</script>
</body>
</html>
